# Mirrors the AVM SDK distribution's formatting, with the nightly-only options
# (`imports_granularity`, `group_imports`, `unstable_features`) dropped so that
# `cargo fmt --check` passes on the pinned stable toolchain. The source still
# follows the SDK convention of one import per line, grouped std / external /
# crate.
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
use_small_heuristics = "Max"
style_edition = "2021"
normalize_comments = true
reorder_impl_items = true
reorder_modules = true
wrap_comments = false
format_code_in_doc_comments = true
format_macro_bodies = true
format_macro_matchers = true
max_width = 100
